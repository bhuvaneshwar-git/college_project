<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Virtual Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
       
        body {
            height: 100vh;
            font-family: "Poppins", sans-serif;
            color: white;
            background: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
            background-size: 400% 400%;
            animation: bgAnimation 12s ease infinite;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes bgAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            text-align: center;
            padding: 2rem 1rem;
        }

        header h1 {
            font-size: 2.5rem;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.6);
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            padding: 0 1rem;
        }

        .card {
            background: rgba(0,0,0,0.7);
            border-radius: 12px;
            padding: 2rem;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(0,0,0,0.7);
        }

        h2 {
            color: #00d4ff;
            margin-bottom: 1rem;
            font-weight: 700;
            border-bottom: 2px solid rgba(0,212,255,0.3);
            padding-bottom: 0.5rem;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        form input, form textarea {
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            background: rgba(255,255,255,0.1);
            color: #fff;
            transition: 0.3s;
        }

        form input::placeholder, form textarea::placeholder {
            color: rgba(255,255,255,0.7);
        }

        form input:focus, form textarea:focus {
            outline: none;
            background: rgba(0,212,255,0.2);
        }

        form button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            background: #00d4ff;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        form button:hover {
            box-shadow: 0 0 15px #00d4ff;
        }

        .highlight {
            color: #00d4ff;
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 1.5rem 1rem;
            margin-top: 3rem;
            background: rgba(0,0,0,0.6);
            color: #00d4ff;
            font-weight: 500;
            border-top: 1px solid rgba(0,212,255,0.3);
        }

        ul {
            list-style: none;
            padding: 0;
        }

        ul li {
            padding: 0.5rem 0;
        }

        @media (max-width: 768px) {
            .card {
                padding: 1.5rem;
            }

            header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Contact Virtual Lab</h1>
    </header>

    <main>
        <div class="card">
            <h2>Get in Touch</h2>
            <form action="https://formspree.io/f/mgvngwgg" method="POST">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <input type="text" name="subject" placeholder="Subject" required>
                <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>

        <div class="card">
            <h2>Contact Info</h2>
            <ul>
                <li>Email: <span class="highlight">contact@virtuallab.com</span></li>
                <li>Phone: <span class="highlight">+91 98765 43210</span></li>
                <li>Address: <span class="highlight">No:3, Main Road, Chennai, India</span></li>
            </ul>
        </div>
    </main>

    <footer>
        &copy; 2025 Virtual Lab Project. All Rights Reserved.
    </footer>
</body>
</html>
